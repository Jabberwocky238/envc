name: release

# Pushing a tag like v0.1.0 runs the test suite on all three platforms, and only
# if every one of them is green builds the binaries and attaches them to a
# GitHub release. Run it by hand from the Actions tab to rebuild an existing tag.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  BIN: envc

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # One integration suite per platform, in tests/{linux,macos,windows}.rs.
      # Each file carries its own `#![cfg(target_os = ...)]`, so this single
      # command runs the matching one and compiles the others away to nothing.
      - name: tests
        run: cargo test --locked

  build:
    name: build (${{ matrix.target }})
    # Six binaries only after all three suites pass.
    needs: test
    # A manual run on a branch is for the tests only: publishing from it would
    # name the assets after the branch and create a release nobody asked for.
    if: github.ref_type == 'tag'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # `apt` and `linker` are empty for native builds; keeping the keys
          # present everywhere makes the `if:` conditions unambiguous.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            ext: ""
            apt: ""
            linker: ""

          # Cross-compiled on the x86_64 runner; clap is pure Rust, so no
          # target libraries are needed beyond the C toolchain and linker.
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            ext: ""
            apt: gcc-aarch64-linux-gnu
            linker: aarch64-linux-gnu-gcc

          # Apple's SDK targets both architectures from an Apple silicon runner.
          - target: aarch64-apple-darwin
            os: macos-latest
            ext: ""
            apt: ""
            linker: ""

          - target: x86_64-apple-darwin
            os: macos-latest
            ext: ""
            apt: ""
            linker: ""

          # arm64 is cross-compiled; the runner's Visual Studio ships the ARM64
          # toolchain. The `.exe` suffix is part of the asset name because that
          # is the file a Windows user downloads and runs.
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            ext: ".exe"
            apt: ""
            linker: ""

          - target: aarch64-pc-windows-msvc
            os: windows-latest
            ext: ".exe"
            apt: ""
            linker: ""

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: install the cross linker
        if: matrix.apt
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.apt }}
          # CARGO_TARGET_<TARGET>_LINKER, derived from the target triple.
          var="CARGO_TARGET_$(echo '${{ matrix.target }}' | tr 'a-z-' 'A-Z_')_LINKER"
          echo "$var=${{ matrix.linker }}" >> "$GITHUB_ENV"

      - name: build
        run: cargo build --release --locked --target ${{ matrix.target }}

      # bash on every runner (Windows included, via Git for Windows) so the
      # same shell expands the same way.
      - name: package
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          target="${{ matrix.target }}"
          ext="${{ matrix.ext }}"
          name="${BIN}-${version}-${target}${ext}"

          # The bare binary, no archive. GitHub does not preserve the execute
          # bit on release assets, so the installer chmods what it downloads.
          mkdir -p dist
          cp "target/${target}/release/${BIN}${ext}" "dist/${name}"
          cp "target/${target}/release/${BIN}${ext}" "dist/${BIN}-${target}${ext}"
          chmod 755 dist/*

          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    name: publish
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # One checksum file for all six, generated here rather than per target:
      # `sha256sum` is not something a Windows runner can be relied on to have.
      - name: checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
