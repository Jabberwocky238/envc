[package]
name = "envc"
version = "0.3.0"
edition = "2021"
rust-version = "1.85"
description = "Profile based environment variable manager for bash"
license = "MIT"

[[bin]]
name = "envc"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
